    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }

    header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }

    .kicker { margin: 0; font-size: 11px; letter-spacing: .14em; color: var(--muted); }

    .btn { display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 14px var(--font-sans); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--mark); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .search { padding-bottom: 12px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 12px; font: 500 15px var(--font-sans); color: var(--ink); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0 2px; align-items: center; }
    .toolbar select, .toolbar label.chk { height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 8px; font: 600 13px var(--font-sans); color: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
    .toolbar label.chk { cursor: pointer; white-space: nowrap; }
    .toolbar label.chk input { margin: 0; }
    .idx { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; scrollbar-width: thin; }
    .chip { height: 36px; min-width: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: 600 14px var(--font-sans); cursor: pointer; }
    .chip[data-active="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    main { padding: 18px 0 48px; }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .entry { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .entry h2 { margin: 0 0 6px; font-family: var(--font-serif); font-size: 18px; color: var(--accent); }
    .entry p { margin: 0; font-size: 15.5px; line-height: 1.8; }

</head>

<header>
  <div class="wrap">

          <option value="or">단어 중 하나라도</option>

        <select id="sort" title="정렬">
          <option value="rel">관련도순</option>
          <option value="alpha">가나다순</option>
          <option value="short">짧은 표제어순</option>
          <option value="long">설명 긴 순</option>
        </select>
        <select id="limit" title="결과 개수">
          <option value="50">50개</option>
          <option value="100" selected>100개</option>
          <option value="200">200개</option>
          <option value="500">500개</option>
        </select>

    </div>
  </div>
</header>
<main>

function byLenDesc(a, b){ return b.length - a.length; }
function headHit(h, multi, exact1, exactOnly){
  const set = new Set(exactOnly);
  const all = [...new Set([...multi, ...exactOnly, ...exact1])].sort(byLenDesc);
  for (const w of all) {
    if (set.has(w) || w.length <= 1) { if (h === w) return w; continue; }
    if (h.includes(w)) return w;
  }
  return "";
}
function descHit(t, words){
  t = t.slice(0, 100);
  for (const w of [...words].sort(byLenDesc)) if (t.includes(w)) return w;
  return "";
}
function sufHit(h, sufs, not){
  for (const s of [...sufs].sort(byLenDesc)) {
    if (h.length > s.length && h.endsWith(s)) {
      if (not && not.some(n => h.endsWith(n))) continue;
      return s;
    }
  }
  return "";

function stripBookSuffix(h){
  if (/서$/.test(h) && BOOK66.includes(h.slice(0, -1))) return h.slice(0, -1);

function classifyEntry(h, t){

  const head80 = t.slice(0, 80);

  const ps = sufHit(h, PLACE_SUF, PLACE_SUF_NOT);
  if (ps) {
    if (PERSON_ID_RE.test(head80) && !PLACE_STRONG_RE.test(head80)) return { cat: "인물", term: "설명" };
    return { cat: "장소", term: ps };
  }
  let w = headHit(h, ANIMAL_MULTI, ANIMAL_1, ANIMAL_EXACT);
  if (w) return { cat: "동물", term: w };
  w = headHit(h, PLANT_MULTI, PLANT_1, PLANT_EXACT);
  if (w) return { cat: "식물", term: w };
  w = headHit(h, NATURE_MULTI, NATURE_1, NATURE_EXACT);
  if (w) return { cat: "자연", term: w };
  const rs = sufHit(h, PERSON_SUF, []);
  if (rs) return { cat: "인물", term: rs };
  for (const s of PERSON_SUF_LAST) {
    if (h.length >= s.length && h.endsWith(s) && !PERSON_SUF_NOT.some(n => h.endsWith(n))) return { cat: "인물", term: s };
  }
  if (GOD_RE.test(head80) && !GOD_PLACE_OK.test(head80)) return { cat: "기타", term: "신" };

  if (/(직명|직분|관직|벼슬)/.test(head80)) return { cat: "기타", term: "제도" };
  if (sufHit(h, OBJECT_SUF, []) || COIN_RE.test(head80)) return { cat: "기타", term: "사물" };
  if (PLACE_STRONG_RE.test(head80)) {
    const _pm = PLACE_STRONG_RE.exec(head80)[0];

  }
  if (PLACE_WEAK_RE.test(head80)) return { cat: "장소", term: "설명" };
  if (PERSON_ROLE_RE.test(head80)) return { cat: "인물", term: "설명" };

function choseong(ch){
  const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) return CHO[Math.floor((code - 0xAC00) / 588)];
  if (/[a-zA-Z]/.test(ch)) return "A-Z";
  if (/[0-9]/.test(ch)) return "0-9";
  return "기타";
}
function setData(name, entries){

    CAT_OF[h] = c; CAT_COUNT[c] = (CAT_COUNT[c] || 0) + 1;

  ).join("");
}
function choStr(s){
  let r = "";
  for (const ch of String(s)) {
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) r += CHO[Math.floor((code - 0xAC00) / 588)];
    else if (/[ㄱ-ㅎ]/.test(ch)) r += ch;

}
function normBase(s, nospace){

function normVerse(s){ return String(s ?? "").toLowerCase().replace(/：/g, ":").replace(/[\s\u3000]+/g, "").replace(/\s*:\s*/g, ":"); }

    if (tok.startsWith("-") && tok.length > 1) neg.push(tok.slice(1));

    if (method === "suffix") return refs.some(r => r.endsWith(n));

  const c = CAT_OF[h] || "기타";
  const verses = extractVerses(t).length ? `<div style="font-size:12px;color:var(--muted)">구절 ${extractVerses(t).slice(0, 3).join(" · ")}</div>` : "";
  return `<article class="entry"><span class="cat">${esc(CAT_LABEL[c] || c)}</span><h2>${hiMulti(h, tokens)}</h2>` +
    `${verses}<p class="${collapsed && long ? "collapsed" : ""}">${hiMulti(t, tokens)}</p>` +
    (long ? `<button class="more" type="button">더 보기</button>` : "") +
    `</article>`;
}
function render(){
  const box = $("list");
  if (!ORDER.length) {
    box.innerHTML = `<div class="empty"><h2>사전 파일이 없습니다</h2><p>bible_dictionary.json을 이 HTML과 같은 폴더에 두거나 [사전 JSON 열기]로 열어 주세요.</p></div>`;
    return;
  }
  if (lastQuery) { renderSearch(); return; }
  let keys = ORDER.filter(passCat);
  if (activeCho !== "전체") keys = keys.filter(h => h && choseong(h[0]) === activeCho);
  const N = Math.min(keys.length, 60);
  let html = keys.slice(0, N).map(h => entryHtml(h, [], true)).join("");
  if (keys.length > N) html += `<div class="empty"><p>외 ${keys.length - N}개 항목 — 위 검색창이나 자음 탭을 이용하세요.</p></div>`;
  box.innerHTML = html || `<div class="empty"><p>해당 자음의 표제어가 없습니다.</p></div>`;
}
function renderSearch(){
  const scope = $("scope").value, method = $("method").value;
  const mode = $("match").value, sort = $("sort").value;
  const lim = parseInt($("limit").value, 10) || 100;
  const nospace = $("nospace").checked;
  const { pos, neg } = parseTokens(lastQuery);
  const headHits = []; let scanned = 0;
  for (const h of ORDER) {
    if (!passCat(h)) continue;
    if (activeCho !== "전체" && choseong(h[0] || "") !== activeCho) continue;
    const t = String(ENTRIES[h] ?? "");
    if (neg.some(n => matchField(h, t, n, scope, method === "chosung" ? "incl" : method, nospace))) continue;
    let ok;
    if (!pos.length) ok = true;
    else if (mode === "or") ok = pos.some(p => matchField(h, t, p, scope, method, nospace));
    else ok = pos.every(p => matchField(h, t, p, scope, method, nospace));
    if (!ok) continue;
    const isHead = pos.length ? pos.some(p => matchOne(h, p, method, nospace)) : true;
    headHits.push({ h, t, isHead });
    scanned++;
    if (headHits.length >= lim) break;
  }
  let keys = headHits;
  if (sort === "alpha") keys.sort((a, b) => a.h.localeCompare(b.h, "ko"));
  else if (sort === "short") keys.sort((a, b) => a.h.length - b.h.length || a.h.localeCompare(b.h, "ko"));
  else if (sort === "long") keys.sort((a, b) => b.t.length - a.t.length);
  else keys.sort((a, b) => (b.isHead - a.isHead) || (a.h.length - b.h.length));
  const nHead = keys.filter(k => k.isHead).length;
  const scopeName = { all: "전체", head: "표제어", desc: "내용", verse: "성경구절" }[scope];
  const methodName = { incl: "포함", prefix: "앞부분", suffix: "뒷부분", exact: "정확히", chosung: "초성" }[method];
  $("status").textContent = `${dictName} · "${lastQuery}" ${keys.length}개 (표제어 ${nHead} + 내용 ${keys.length - nHead}) · ${scopeName}/${methodName}/${mode === "and" ? "AND" : "OR"}`;
  $("list").innerHTML = keys.length
    ? keys.map(k => entryHtml(k.h, pos, true)).join("")
    : `<div class="empty"><p>검색 결과가 없습니다.</p><p style="font-size:13px">예) 사랑 · ㅅㄹ(초성) · 요 2:1(구절) · 사랑 -하나님(제외) · "혼인 잔치"(정확구)</p></div>`;
}
function doSearch(q){
  lastQuery = (q || "").trim();
  if (!lastQuery) {
    const keys = ORDER.filter(passCat);
    $("status").textContent = `${dictName} · ${keys.length}개 항목`;
    render(); return;
  }
  renderSearch();
}

$("idx").onclick = e => {
  const b = e.target.closest("[data-cho]"); if (!b) return;
  activeCho = b.dataset.cho; lastQuery = ""; $("q").value = "";
  buildIndex(); render();
};
$("catrow").onclick = e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  activeCat = b.dataset.cat; lastQuery = ""; $("q").value = "";
  buildCats(); render();
};
$("list").onclick = e => {
  const b = e.target.closest(".more"); if (!b) return;
  const p = b.previousElementSibling;
  const collapsed = p.classList.toggle("collapsed");
  b.textContent = collapsed ? "더 보기" : "접기";
};
let tmr = null;
$("q").oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => doSearch(e.target.value), 200); };
$("q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); doSearch(e.target.value); } };
$("btn-search").onclick = () => doSearch($("q").value);
for (const id of ["scope", "method", "match", "sort", "limit", "nospace"]) {
  $(id).onchange = () => { if (lastQuery) renderSearch(); };
}

function normalize(raw){
  if (!raw || typeof raw !== "object") return null;
  if (raw.entries && typeof raw.entries === "object" && Object.keys(raw.entries).length) {
    const flat = {};
    for (const [h, v] of Object.entries(raw.entries)) flat[String(h)] = Array.isArray(v) ? v.join(" ") : String(v ?? "");
    return { name: (typeof raw.dictionary === "string" && raw.dictionary.trim()) || "성경 사전", entries: flat };
  }
  return null;
}
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => res(true); s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}
async function fetchJson(url){
  const res = await fetch(url, { cache: "default" });
  if (!res.ok) throw new Error(url);
  const t = (await res.text()).trim();
  if (!t || t[0] === "<") throw new Error(url);
  return JSON.parse(t);
}
async function autoLoad(){
  const params = new URLSearchParams(location.search);
  const files = [params.get("file"), "./bible_dictionary.json", "./bibles/bible_dictionary.json"].filter(Boolean);
  for (const u of files) {
    try { const d = normalize(await fetchJson(u)); if (d) { setData(d.name, d.entries); return true; } } catch {}
  }
  for (const u of ["./bible_dictionary.js", "./bibles/bible_dictionary.js"]) {
    try {
      await loadScript(u);
      const raw = window.__BIBLE_DATA__ && window.__BIBLE_DATA__["bible_dictionary"];
      const d = normalize(raw);
      if (d) { setData(d.name, d.entries); return true; }
    } catch {}
  }
  return false;
}
$("btn-file").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    const d = normalize(JSON.parse(await f.text()));
    if (!d) throw new Error("entries 없음");
    setData(d.name, d.entries);
  } catch (err) {
    $("status").textContent = "사전 JSON을 읽지 못했습니다: " + (err && err.message);
  }
};

(async function init(){
  const ok = await autoLoad().catch(() => false);
  if (!ok) {
    $("status").textContent = "사전 파일을 찾지 못했습니다. bible_dictionary.json을 같은 폴더에 두거나 [사전 JSON 열기]를 사용하세요.";
    render();
  }
  const q = new URLSearchParams(location.search).get("q");
  if (q && ORDER.length) { $("q").value = q; doSearch(q); }
})();
</script>
</body>
</html>
