<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>성경 뷰어</title>
  <meta name="description" content="한국어 성경 JSON 뷰어 — 같은 폴더 JSON 자동 불러오기, 검색, 번역 대조, 본문만 복사" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%232c4a44' width='32' height='32' rx='7'/%3E%3Cpath fill='%23f4f0e8' d='M8 8h7.4c1.7 0 2.7.8 2.7 2.2s-1 2.2-2.7 2.2H8zm8.2 5.2h7.4c1.7 0 2.7.8 2.7 2.2s-1 2.2-2.7 2.2h-7.4zM8 18.4h7.4c1.7 0 2.7.8 2.7 2.2s-1 2.2-2.7 2.2H8z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eee4;
      --surface: #faf7f1;
      --ink: #1c1914;
      --muted: #6b6458;
      --subtle: #8a8276;
      --line: #d9d0c3;
      --accent: #2c4a44;
      --accent-fg: #f4f0e8;
      --mark: #e7dfc8;
      --font-sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-serif: "Noto Serif KR", "Batang", Georgia, serif;
      --radius: 10px;
      --shadow: 0 12px 40px rgba(28, 25, 20, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-sans); user-select: none; }
    button, [role="button"] { cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.4; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
    header {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--line);
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
    }
    .head { display: flex; align-items: center; gap: 12px; padding: 14px 0 8px; }
    .kicker { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-family: var(--font-serif); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .head-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      padding-bottom: 12px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 20px; }
      .head { flex-wrap: wrap; }
      .head-actions { width: 100%; }
      .head-actions .btn { flex: 1; }
    }
    label.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    label.field span { font-size: 11px; font-weight: 500; color: var(--muted); }
    select, input[type="search"], .btn {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font: 500 14px var(--font-sans);
    }
    select, input[type="search"] { padding: 0 10px; width: 100%; }
    select:focus, input:focus, .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 12px; white-space: nowrap;
      transition: background-color 150ms ease, transform 150ms ease;
    }
    .btn:hover:not(:disabled) { background: var(--mark); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn[hidden], [hidden] { display: none !important; }
    .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 88%, black); }
    .navs { display: flex; align-items: flex-end; gap: 4px; }
    .search { position: relative; padding-bottom: 14px; }
    .search-row { display: flex; gap: 8px; }
    .search-field { position: relative; flex: 1; min-width: 0; }
    .search input { padding-left: 36px; padding-right: 12px; }
    .search .icon {
      position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--subtle); pointer-events: none;
    }
    .search .btn { flex-shrink: 0; }
    .results {
      position: absolute; left: 0; right: 0; top: 44px; z-index: 30;
      max-height: 280px; overflow: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .results button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 10px 12px; font: 400 14px var(--font-sans); color: var(--ink);
    }
    .results button:hover { background: var(--mark); }
    .results .ref { display: block; font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 2px; }
    .results .empty { padding: 16px 12px; color: var(--muted); font-size: 14px; }
    .chapters { border-bottom: 1px solid var(--line); background: var(--surface); }
    .chapters .wrap { display: flex; align-items: center; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
    .chapters b { font-size: 11px; font-weight: 500; color: var(--muted); }
    .chips { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: thin; padding: 2px 0; }
    .chip {
      height: 36px; min-width: 36px; padding: 0 8px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink);
      font: 500 13px/1 var(--font-sans); font-variant-numeric: tabular-nums;
    }
    .chip[data-active="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .disp { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
    .disp b { font-size: 11px; font-weight: 500; color: var(--muted); }
    .tog {
      height: 36px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink);
      font: 500 13px/1 var(--font-sans);
    }
    .tog[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .tog[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .verse-ref { color: var(--accent); font-weight: 600; font-family: var(--font-sans); font-size: 13px; margin-right: 6px; }
    .hit-book { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-sans); margin: 2px 0 4px; }
    .tr-block { display: block; margin: 4px 0 2px; }
    .tr-name {
      display: inline-block; min-width: 4.8em; margin-right: 8px;
      font-family: var(--font-sans); font-size: 11px; font-weight: 600;
      color: var(--accent); letter-spacing: 0.02em;
    }
    .tr-block.primary .tr-name { color: var(--ink); }
    #bible-content p.hit { cursor: pointer; }
    #bible-content p.hit:hover { background: var(--mark); }
    .compare-bar {
      display: none; border-bottom: 1px solid var(--line); background: var(--bg);
    }
    .compare-bar.show { display: block; }
    .compare-bar .wrap { display: flex; align-items: center; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
    .compare-bar .hint { margin: 0; font-size: 12px; color: var(--muted); }
    main { padding: 22px 0 48px; }
    .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    .meta h2 { margin: 0; font-family: var(--font-serif); font-size: 20px; font-weight: 600; }
    .meta p { margin: 0; font-size: 12px; color: var(--muted); }
    .meta-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #bible-content, #bible-content * { user-select: text; -webkit-user-select: text; }
    #bible-content {
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.85;
    }
    #bible-content p { margin: 0; padding: 4px 6px; border-radius: 8px; }
    #bible-content p.hl { background: var(--mark); }
    .empty {
      text-align: center; padding: 64px 20px;
      border: 1px dashed var(--line); border-radius: 16px; background: var(--surface);
    }
    .empty h2 { font-family: var(--font-serif); margin: 0 0 8px; }
    .empty p { color: var(--muted); max-width: 420px; margin: 0 auto 16px; line-height: 1.6; }
    #loadbar { margin: 0; padding: 0 0 10px; font-size: 12px; color: var(--muted); }
    footer { border-top: 1px solid var(--line); padding: 12px 16px; text-align: center; font-size: 12px; color: var(--subtle); }
    .drop {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: color-mix(in oklab, var(--ink) 40%, transparent);
      align-items: center; justify-content: center; padding: 24px;
    }
    .drop.show { display: flex; }
    .drop-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 40px 36px; text-align: center; box-shadow: var(--shadow);
    }
    .err { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="head">
        <div style="flex:1;min-width:0">
          <p class="kicker">Korean Bible</p>
          <h1>성경 뷰어</h1>
        </div>
        <div class="head-actions">
          <button class="btn" id="btn-folder" type="button">폴더에서 모두 열기</button>
          <button class="btn primary" id="btn-load" type="button">JSON 불러오기</button>
        </div>
        <input id="file" type="file" accept=".json,application/json" multiple hidden />
        <input id="dir" type="file" accept=".json,application/json" multiple webkitdirectory directory hidden />
      </div>
      <div class="grid">
        <label class="field">
          <span>성경종류</span>
          <select id="sel-tr"></select>
        </label>
        <label class="field">
          <span>성경목록</span>
          <select id="sel-book"></select>
        </label>
        <div class="navs">
          <button class="btn" id="book-prev" type="button">이전</button>
          <button class="btn" id="book-next" type="button">다음</button>
        </div>
        <div class="navs">
          <button class="btn" id="ch-prev" type="button">이전장</button>
          <button class="btn" id="ch-next" type="button">다음장</button>
        </div>
      </div>
      <div class="search">
        <div class="search-row">
          <div class="search-field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input id="q" type="search" placeholder="검색 · 예: 태초에, 요 3:16, 창세기 1:1" autocomplete="off" />
            <div class="results" id="results" hidden></div>
          </div>
          <button class="btn primary" id="btn-search" type="button">검색</button>
        </div>
      </div>
      <p id="loadbar" hidden></p>
    </div>
  </header>
  <div class="chapters">
    <div class="wrap">
      <b>장</b>
      <div class="chips" id="chips"></div>
      <div class="disp">
        <b>표시</b>
        <button class="tog" id="tog-book" type="button" aria-pressed="true" title="본문에서 권 약어를 켜거나 끕니다">권</button>
        <button class="tog" id="tog-ch" type="button" aria-pressed="true" title="본문에서 장 번호를 켜거나 끕니다">장</button>
        <button class="tog" id="tog-cmp" type="button" aria-pressed="false" title="다른 번역과 나란히 대조합니다">대조</button>
      </div>
    </div>
  </div>
  <div class="compare-bar" id="compare-bar">
    <div class="wrap">
      <b>대조 번역</b>
      <div class="chips" id="cmp-chips"></div>
      <p class="hint" id="cmp-hint"></p>
    </div>
  </div>
  <main>
    <div class="wrap">
      <p class="err" id="err" hidden></p>
      <div id="empty" class="empty" hidden></div>
      <div id="reader">
        <div class="meta">
          <div>
            <h2 id="title">창세기 1장</h2>
            <p id="sub"></p>
          </div>
          <div class="meta-actions">
            <button class="btn" id="btn-back" type="button" hidden>본문으로</button>
            <button class="btn" id="btn-tab" type="button" hidden>새 탭에서 열기</button>
          </div>
        </div>
        <div id="bible-content"></div>
      </div>
    </div>
  </main>
  <footer id="status">같은 폴더의 JSON을 자동으로 찾습니다. GitHub Pages에서는 bibles.json이 필요합니다. PC에서 파일로 연 경우에는 [폴더에서 모두 열기]를 사용하세요. 데이터 JSON은 포함되어 있지 않습니다.</footer>
  <div class="drop" id="drop"><div class="drop-card"><h2>JSON 파일을 여기에 놓으세요</h2><p style="color:var(--muted);margin:8px 0 0">폴더를 통째로 놓으면 안의 JSON을 모두 불러옵니다</p></div></div>

<script>
const TRANSLATIONS = [
  { id: "kordob", label: "우리말성경", files: ["kordob.json"] },
  { id: "koreasy", label: "쉬운성경", files: ["koreasy.json"] },
  { id: "korhkjv", label: "흠정역", files: ["Korhkjv.json", "korhkjv.json"] },
  { id: "korhrv", label: "개역한글", files: ["Korhrv.json", "korhrv.json"] },
  { id: "korklb", label: "현대인", files: ["korklb.json"] },
  { id: "kornkrv", label: "개역개정", files: ["kornkrv.json", "kornkrvs.json"] },
  { id: "kornrsv", label: "새번역", files: ["kornrsv.json"] },
  { id: "kortkv", label: "현대어", files: ["kortkv.json"] },
];
const ABBR = {"창세기":"창","출애굽기":"출","탈출기":"출","레위기":"레","민수기":"민","신명기":"신","여호수아":"수","사사기":"삿","판관기":"삿","룻기":"룻","사무엘상":"삼상","사무엘하":"삼하","열왕기상":"왕상","열왕기하":"왕하","역대상":"대상","역대하":"대하","에스라":"스","느헤미야":"느","에스더":"에","욥기":"욥","시편":"시","잠언":"잠","전도서":"전","아가":"아","이사야":"사","예레미야":"렘","예레미야애가":"애","에스겔":"겔","다니엘":"단","호세아":"호","요엘":"욜","아모스":"암","오바댜":"옵","요나":"욘","미가":"미","나훔":"나","하박국":"합","스바냐":"습","학개":"학","스가랴":"슥","말라기":"말","마태복음":"마","마가복음":"막","누가복음":"눅","요한복음":"요","사도행전":"행","로마서":"롬","고린도전서":"고전","고린도후서":"고후","갈라디아서":"갈","에베소서":"엡","빌립보서":"빌","골로새서":"골","데살로니가전서":"살전","데살로니가후서":"살후","디모데전서":"딤전","디모데후서":"딤후","디도서":"딛","빌레몬서":"몬","히브리서":"히","야고보서":"약","베드로전서":"벧전","베드로후서":"벧후","요한일서":"요일","요한이서":"요이","요한삼서":"요삼","유다서":"유","요한계시록":"계"};
const ORDER = Object.keys(ABBR);
const DISCOVER_DIRS = ["./", "./bibles/"];
const INDEX_FILES = ["bibles.json","index.json","bible-index.json","files.json"];
const INDEX_BASENAMES = new Set(INDEX_FILES.concat(["package.json","package-lock.json"]));
const FETCH_INDEX_MS = 8000;
const FETCH_JSON_MS = 120000;

function bookAbbr(n){ return ABBR[n] || n.slice(0,2); }
function sortBooks(names){
  return [...names].sort((a,b)=>{
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia>=0 && ib>=0) return ia-ib;
    if (ia>=0) return -1; if (ib>=0) return 1;
    return a.localeCompare(b,"ko");
  });
}
function numKeys(obj){ return Object.keys(obj||{}).sort((a,b)=>Number(a)-Number(b)); }
function pad2(n){ n=String(n); return n.length>=2?n:n.padStart(2,"0"); }
function matchId(filename){
  const base = filename.replace(/^.*[/\\]/,"").toLowerCase();
  for (const t of TRANSLATIONS){
    if (t.files.some(f=>f.toLowerCase()===base) || (t.id+".json")===base) return t.id;
  }
  return base.replace(/\.json$/i,"") || "custom";
}
function strip(k, sfx){ k=String(k).trim(); return k.endsWith(sfx)?k.slice(0,-sfx.length):k; }
function asText(v){ if (typeof v==="string") return v; if (typeof v==="number") return String(v); if (v && typeof v==="object" && typeof v.text==="string") return v.text; return null; }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    if(c === "&") return "&" + "amp;";
    if(c === "<") return "&" + "lt;";
    if(c === ">") return "&" + "gt;";
    if(c === '"') return "&" + "quot;";
    return "&#39;";
  });
}
function parseDoc(raw, filename){
  if (!raw || typeof raw!=="object") throw new Error("JSON 최상위가 객체가 아닙니다.");
  const src = raw.books && typeof raw.books==="object" ? raw.books : raw;
  const books = {};
  for (const [bk, chs] of Object.entries(src)){
    if (!chs || typeof chs!=="object") continue;
    const chapters = {};
    for (const [ck, vs] of Object.entries(chs)){
      if (!vs || typeof vs!=="object") continue;
      const verses = {};
      for (const [vk, val] of Object.entries(vs)){
        const text = asText(val);
        const verse = strip(vk,"절");
        if (verse && text!=null) verses[verse]=text;
      }
      const chapter = strip(ck,"장");
      if (chapter && Object.keys(verses).length) chapters[chapter]=verses;
    }
    const name = String(bk).trim();
    if (name && Object.keys(chapters).length) books[name]=chapters;
  }
  if (!Object.keys(books).length) throw new Error("books 데이터를 찾지 못했습니다.");
  return {
    id: matchId(filename),
    translation: (typeof raw.translation==="string" && raw.translation.trim()) || filename,
    books,
    source: "file"
  };
}

const DB_NAME="bible-reader", STORE="translations", HANDLE_STORE="handles";
function openDb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,2);
    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE);
      if(!r.result.objectStoreNames.contains(HANDLE_STORE)) r.result.createObjectStore(HANDLE_STORE);
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function saveBible(doc){
  const db=await openDb();
  await new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(doc, doc.id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  db.close();
}
async function loadAll(){
  try{
    const db=await openDb();
    const rows=await new Promise((res,rej)=>{ const tx=db.transaction(STORE,"readonly"); const r=tx.objectStore(STORE).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
    db.close();
    return (rows||[]).filter(d=>d && d.books && typeof d.books==="object" && d.id && d.id!=="__dirhandle__");
  }catch{ return []; }
}
async function saveDirHandle(handle){
  try{
    const db=await openDb();
    await new Promise((res,rej)=>{ const tx=db.transaction(HANDLE_STORE,"readwrite"); tx.objectStore(HANDLE_STORE).put(handle, "dir"); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
    db.close();
  }catch{}
}
async function loadDirHandle(){
  try{
    const db=await openDb();
    const handle=await new Promise((res,rej)=>{ const tx=db.transaction(HANDLE_STORE,"readonly"); const r=tx.objectStore(HANDLE_STORE).get("dir"); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
    db.close();
    return handle||null;
  }catch{ return null; }
}

  }

const bibles = { kornkrv: SAMPLE };
const extraMeta = [];
let translationId="kornkrv", book="창세기", chapter="1", hl=null;
let showBook=true, showChapter=true, compareOn=false;
let compareIds=[];
let viewMode="chapter";
let lastQuery="";
let lastHits=[];
let skipAutoTab=false;
(function loadDisp(){
  try{
    const s=JSON.parse(localStorage.getItem("bible-reader:disp")||"null");
    if(s && typeof s==="object"){
      if(typeof s.showBook==="boolean") showBook=s.showBook;
      if(typeof s.showChapter==="boolean") showChapter=s.showChapter;
      if(typeof s.compareOn==="boolean") compareOn=s.compareOn;
      if(Array.isArray(s.compareIds)) compareIds=s.compareIds.filter(x=>typeof x==="string");
    }
  }catch{}
})();

const $ = (id)=>document.getElementById(id);
const selTr=$("sel-tr"), selBook=$("sel-book"), chips=$("chips"), content=$("bible-content");

function saveDisp(){
  try{ localStorage.setItem("bible-reader:disp", JSON.stringify({showBook, showChapter, compareOn, compareIds})); }catch{}
}
function trLabel(id){
  const t=TRANSLATIONS.find(x=>x.id===id) || extraMeta.find(x=>x.id===id);
  if(t) return t.label;
  const d=bibles[id];
  return d ? (d.translation||id) : id;
}
function allMeta(){
  const known=TRANSLATIONS.map(t=>({...t}));
  const seen=new Set(known.map(t=>t.id));
  for(const t of extraMeta){
    if(!seen.has(t.id)){ known.push(t); seen.add(t.id); }
  }
  for(const id of Object.keys(bibles)){
    if(!seen.has(id)){ known.push({id, label: trLabel(id), files:[]}); seen.add(id); }
  }
  return known;
}
function loadedRealIds(){
  return Object.keys(bibles).filter(id => bibles[id] && bibles[id].source!=="sample");
}
function loadedIds(){
  const real=loadedRealIds();
  return real.length ? real : Object.keys(bibles);
}
function syncTogs(){
  const tb=$("tog-book"), tc=$("tog-ch"), tm=$("tog-cmp");
  if(tb){ tb.setAttribute("aria-pressed", String(showBook)); tb.title=showBook?"권 약어 숨기기":"권 약어 보이기"; }
  if(tc){ tc.setAttribute("aria-pressed", String(showChapter)); tc.title=showChapter?"장 번호 숨기기":"장 번호 보이기"; }
  if(tm){ tm.setAttribute("aria-pressed", String(compareOn)); tm.title=compareOn?"번역 대조 끄기":"다른 번역과 나란히 대조"; }
  const bar=$("compare-bar");
  if(bar) bar.classList.toggle("show", compareOn);
}
function verseLabel(abbr, ch, v){
  if(showBook && showChapter) return `${abbr} ${ch}: ${v}`;
  if(!showBook && showChapter) return `${ch}: ${v}`;
  if(showBook && !showChapter) return `${abbr} ${v}`;
  return `${v}`;
}
function current(){ return bibles[translationId]; }
function bookNames(){ const d=current(); return d?sortBooks(Object.keys(d.books)):[]; }
function chapters(){ const d=current(); return d&&d.books[book]?numKeys(d.books[book]):[]; }

function fillTr(){
  selTr.innerHTML = allMeta().map(t=>{
    const loaded=bibles[t.id];
    const tag=!loaded?"없음":loaded.source==="sample"?"샘플":"로드됨";
    return `<option value="${esc(t.id)}">${esc(t.label)} · ${tag}</option>`;
  }).join("");
  if(!allMeta().some(t=>t.id===translationId)) translationId = allMeta()[0]?.id || translationId;
  selTr.value=translationId;
}
function fillBooks(){
  const names=bookNames();
  selBook.innerHTML=names.map(n=>`<option value="${esc(n)}">${esc(bookAbbr(n))} · ${esc(n)}</option>`).join("");
  if (names.length && !names.includes(book)) book=names[0];
  selBook.value=book;
  selBook.disabled=!names.length;
}
function fillChips(){
  const chs=chapters();
  if (chs.length && !chs.includes(chapter)) chapter=chs[0];
  chips.innerHTML=chs.map(n=>`<button class="chip" type="button" data-ch="${esc(n)}" data-active="${n===chapter}">[${pad2(n)}]</button>`).join("");
  const act=chips.querySelector("[data-active='true']");
  if (act) act.scrollIntoView({inline:"center", block:"nearest"});
}
function fillCmp(){
  const ids=loadedIds();
  const others=ids.filter(id=>id!==translationId);
  if(compareOn && !compareIds.length){
    compareIds=others.slice();
    saveDisp();
  }
  compareIds=compareIds.filter(id=>id!==translationId && bibles[id]);
  const box=$("cmp-chips");
  if(!box) return;
  box.innerHTML = others.map(id=>{
    const on=compareIds.includes(id);
    return `<button class="chip" type="button" data-cmp="${esc(id)}" data-active="${on}">${esc(trLabel(id))}</button>`;
  }).join("");
  const hint=$("cmp-hint");
  if(hint){
    hint.textContent = others.length
      ? "본문에서 같은 절을 나란히 봅니다"
      : "다른 번역 JSON을 불러오면 대조할 수 있습니다";
  }
}
function compareBlocks(bookName, ch, v, primaryText){
  if(!compareOn) return esc(primaryText);
  const blocks=[];
  blocks.push(`<span class="tr-block primary"><span class="tr-name">${esc(trLabel(translationId))}</span>${esc(primaryText)}</span>`);
  for(const id of compareIds){
    if(id===translationId || !bibles[id]) continue;
    const t=bibles[id].books?.[bookName]?.[ch]?.[v];
    blocks.push(`<span class="tr-block"><span class="tr-name">${esc(trLabel(id))}</span>${t!=null?esc(t):"—"}</span>`);
  }
  return blocks.join("");
}

function render(){
  fillTr(); fillBooks(); fillChips(); fillCmp(); syncTogs();
  const d=current();
  const meta=allMeta().find(t=>t.id===translationId);
  const names=bookNames();
  const chs=chapters();
  const bi=names.indexOf(book), ci=chs.indexOf(chapter);
  $("book-prev").disabled = bi<=0;
  $("book-next").disabled = bi<0 || bi>=names.length-1;
  $("ch-prev").disabled = bi<=0 && ci<=0;
  $("ch-next").disabled = bi>=names.length-1 && ci>=chs.length-1;

  if(viewMode==="search"){
    renderSearchView();
    return;
  }

  $("btn-back").hidden=true;
  $("btn-tab").hidden=true;
  const verses = d?.books?.[book]?.[chapter];
  if (!d || !verses){
    $("reader").hidden=true;
    $("empty").hidden=false;
    $("empty").innerHTML=`<h2>${esc(meta?meta.label:translationId)} JSON이 없습니다</h2>
      <p>보유하신 <code>${esc(meta&&meta.files[0]?meta.files[0]:translationId+".json")}</code> 파일을 이 HTML과 같은 폴더에 두거나 [폴더에서 모두 열기]·[JSON 불러오기]로 열어 주세요. 데이터 JSON은 포함되어 있지 않습니다.</p>
      <button class="btn primary" type="button" id="empty-load">파일 선택</button>
      <button class="btn" type="button" id="empty-folder" style="margin-left:8px">폴더에서 모두 열기</button>`;
    const b=$("empty-load"); if(b) b.onclick=()=>$("file").click();
    const f=$("empty-folder"); if(f) f.onclick=()=>pickFolder();
    return;
  }
  $("empty").hidden=true; $("reader").hidden=false;
  $("title").textContent = `${book} ${chapter}장`;
  const cmpNote = compareOn && compareIds.length ? ` · 대조 ${compareIds.length}종` : "";
  $("sub").textContent = `${meta?meta.label:d.translation}${d.source==="sample"?" · 샘플":""} · ${numKeys(verses).length}절${cmpNote} · Ctrl+A 는 본문만 선택`;
  const abbr=bookAbbr(book);
  content.innerHTML = numKeys(verses).map(v=>{
    const cls = hl===v ? "hl" : "";
    const label = verseLabel(abbr, chapter, v);
    return `<p id="v-${esc(v)}" class="${cls}"><span class="verse-ref">${esc(label)}</span>${compareBlocks(book, chapter, v, verses[v])}</p>`;
  }).join("");
  try{ localStorage.setItem("bible-reader:pos", JSON.stringify({translationId, book, chapter})); }catch{}
}

function renderSearchView(){
  $("empty").hidden=true; $("reader").hidden=false;
  $("btn-back").hidden=false;
  $("btn-tab").hidden=false;
  const meta=allMeta().find(t=>t.id===translationId);
  const d=current();
  $("title").textContent = `검색 결과`;
  const cmpNote = compareOn && compareIds.length ? ` · 대조 ${compareIds.length}종` : "";
  $("sub").textContent = `"${lastQuery}" · ${lastHits.length}절 · ${meta?meta.label:(d&&d.translation)||translationId}${cmpNote} · Ctrl+A 는 본문만 선택`;
  if(!lastHits.length){
    content.innerHTML = `<p>검색 결과가 없습니다.</p>`;
    return;
  }
  content.innerHTML = lastHits.map(h=>{
    const label = verseLabel(h.abbr, h.chapter, h.verse);
    return `<p class="hit" data-b="${esc(h.book)}" data-c="${esc(h.chapter)}" data-v="${esc(h.verse)}"><span class="verse-ref">${esc(label)}</span><span class="hit-book">${esc(h.book)}</span>${compareBlocks(h.book, h.chapter, h.verse, h.text)}</p>`;
  }).join("");
}

function goBook(name){
  const d=current(); if(!d?.books[name]) return;
  viewMode="chapter";
  book=name; chapter=numKeys(d.books[name])[0]||"1"; hl=null; render();
  content.parentElement.scrollIntoView({block:"start"});
}
function goCh(n){ viewMode="chapter"; chapter=n; hl=null; render(); }
function shiftBook(dir){
  const names=bookNames(); const i=names.indexOf(book)+dir;
  if(i<0||i>=names.length) return; goBook(names[i]);
}
function shiftCh(dir){
  const d=current(); if(!d) return;
  viewMode="chapter";
  const names=bookNames(); const chs=chapters();
  const ci=chs.indexOf(chapter)+dir;
  if(ci>=0 && ci<chs.length){ goCh(chs[ci]); return; }
  const bi=names.indexOf(book)+dir;
  if(bi<0||bi>=names.length) return;
  book=names[bi];
  const next=numKeys(d.books[book]);
  chapter = dir===1 ? (next[0]||"1") : (next[next.length-1]||"1");
  hl=null; render();
}

function rememberMeta(doc){
  if(TRANSLATIONS.some(t=>t.id===doc.id)) return;
  if(!extraMeta.some(t=>t.id===doc.id)){
    extraMeta.push({ id: doc.id, label: doc.translation || doc.id, files: [] });
  }
}

async function ingest(docs, opts){
  if(!docs.length) return;
  const selectFirst = !opts || opts.selectFirst !== false;
  const prevId = translationId;
  const prevWasSample = !bibles[prevId] || bibles[prevId].source==="sample";
  for(const d of docs){
    rememberMeta(d);
    bibles[d.id]=d;
    if(d.source!=="sample") try{ await saveBible(d); }catch{}
  }
  if(selectFirst){
    translationId=docs[0].id;
  } else if(prevWasSample || !bibles[prevId] || bibles[prevId].source==="sample"){
    translationId = (bibles.kornkrv && bibles.kornkrv.source!=="sample") ? "kornkrv" : docs[0].id;
  } else {
    translationId = prevId;
  }
  const names=docs.map(d=>trLabel(d.id)).join(", ");
  $("status").textContent=`${docs.length}개 번역본 불러옴 · ${names}`;
  $("err").hidden=true;
  const pos=(()=>{try{return JSON.parse(localStorage.getItem("bible-reader:pos")||"null")}catch{return null}})();
  const d=current();
  const namesB=sortBooks(Object.keys(d.books));
  book = (pos && pos.translationId===translationId && namesB.includes(pos.book)) ? pos.book : (namesB.includes(book)?book:namesB[0]);
  const chs=numKeys(d.books[book]||{});
  chapter = (pos && pos.translationId===translationId && pos.book===book && chs.includes(pos.chapter)) ? pos.chapter : (chs.includes(chapter)?chapter:(chs[0]||"1"));
  if(compareOn){
    const others=loadedIds().filter(id=>id!==translationId);
    if(!compareIds.length) compareIds=others.slice();
  }
  render();
}

async function onFiles(files){
  const list=[...files].filter(f=>{
    const name=f.name.replace(/^.*[/\\]/,"");
    if(!/\.json$/i.test(name)) return false;
    if(INDEX_BASENAMES.has(name.toLowerCase())) return false;
    if(/package-lock|tsconfig|manifest/i.test(name)) return false;
    return true;
  });
  if(!list.length){ $("err").hidden=false; $("err").textContent="JSON 파일을 선택해 주세요."; return; }
  const ok=[], errors=[];
  for(const file of list){
    try{
      const raw=JSON.parse(await file.text());
      ok.push(parseDoc(raw, file.name));
    }catch(e){ errors.push((e&&e.message)||file.name+" 실패"); }
  }
  if(ok.length) await ingest(ok);
  if(errors.length){ $("err").hidden=false; $("err").textContent=errors.join(" · "); }
  else $("err").hidden=true;
}

async function collectJsonFromDir(dir, depth){
  const files=[];
  try{
    for await (const [name, handle] of dir.entries()){
      if(handle.kind==="file" && /\.json$/i.test(name)){
        files.push(await handle.getFile());
      } else if(handle.kind==="directory" && depth>0){
        try{ files.push(...await collectJsonFromDir(handle, depth-1)); }catch{}
      }
    }
  }catch{}
  return files;
}
async function loadFromDirHandle(dir, selectFirst){
  setLoad("폴더에서 JSON을 읽는 중…");
  const files=await collectJsonFromDir(dir, 2);
  setLoad("");
  if(!files.length){
    $("err").hidden=false;
    $("err").textContent="선택한 폴더에서 JSON 파일을 찾지 못했습니다.";
    return;
  }
  await onFiles(files);
  if(selectFirst===false) return;
}
function pickFolder(){
  if(window.showDirectoryPicker){
    window.showDirectoryPicker({ mode:"read" }).then(async dir=>{
      await saveDirHandle(dir);
      await loadFromDirHandle(dir, true);
    }).catch(err=>{
      if(err && err.name==="AbortError") return;
      $("dir").click();
    });
    return;
  }
  $("dir").click();
}
async function restoreSavedFolder(){
  const handle=await loadDirHandle();
  if(!handle || typeof handle.queryPermission!=="function") return false;
  try{
    const perm=await handle.queryPermission({ mode:"read" });
    if(perm!=="granted") return false;
    await loadFromDirHandle(handle, false);
    return true;
  }catch{
    return false;
  }
}

function findBook(names, q){
  q=q.trim(); if(!q) return null;
  return names.find(n=>n===q) || names.find(n=>bookAbbr(n)===q) || names.find(n=>n.startsWith(q)||bookAbbr(n).startsWith(q)) || null;
}
function search(q){
  const d=current(); if(!d || q.trim().length<2) return [];
  q=q.trim();
  const names=Object.keys(d.books);
  const m=q.match(/^(.+?)\s*(\d+)\s*[:：장]\s*(\d+)\s*절?$/);
  if(m){
    const b=findBook(names,m[1]);
    if(b && d.books[b]?.[m[2]]?.[m[3]]){
      return [{book:b,abbr:bookAbbr(b),chapter:m[2],verse:m[3],text:d.books[b][m[2]][m[3]]}];
    }
  }
  const needle=q.toLowerCase(); const hits=[];
  for(const b of names){
    for(const c of numKeys(d.books[b])){
      for(const v of numKeys(d.books[b][c])){
        const text=d.books[b][c][v];
        if(text.toLowerCase().includes(needle)){
          hits.push({book:b,abbr:bookAbbr(b),chapter:c,verse:v,text});
          if(hits.length>=80) return hits;
        }
      }
    }
  }
  return hits;
}
function showResults(hits, q){
  const box=$("results");
  if(q.trim().length<2){ box.hidden=true; return; }
  box.hidden=false;
  if(!hits.length){ box.innerHTML=`<div class="empty">검색 결과가 없습니다. Enter 로 본문에 표시합니다.</div>`; return; }
  box.innerHTML=hits.map(h=>`<button type="button" data-b="${esc(h.book)}" data-c="${esc(h.chapter)}" data-v="${esc(h.verse)}"><span class="ref">${esc(h.abbr)} ${esc(h.chapter)}:${esc(h.verse)} · ${esc(h.book)}</span>${esc(h.text)}</button>`).join("");
}

function searchUrl(q){
  const url=new URL(location.href);
  url.searchParams.set("view","search");
  url.searchParams.set("q", q);
  url.searchParams.set("tr", translationId);
  if(compareOn && compareIds.length) url.searchParams.set("cmp", compareIds.join(","));
  else url.searchParams.delete("cmp");
  return url.toString();
}
function openSearchTab(q){
  const w=window.open(searchUrl(q), "_blank");
  if(w) return true;
  $("err").hidden=false;
  $("err").textContent="팝업이 차단되었습니다. [새 탭에서 열기]를 누르거나 팝업을 허용해 주세요.";
  return false;
}
function runSearch(q, {openTab}={openTab:true}){
  q=(q||"").trim();
  if(q.length<2){
    $("err").hidden=false;
    $("err").textContent="검색어를 두 글자 이상 입력해 주세요.";
    return;
  }
  lastQuery=q;
  lastHits=search(q);
  viewMode="search";
  $("results").hidden=true;
  $("err").hidden=true;
  render();
  content.parentElement.scrollIntoView({block:"start"});
  if(openTab && !skipAutoTab) openSearchTab(q);
}

selTr.onchange=()=>{ translationId=selTr.value; const d=current(); if(d){ const names=bookNames(); book=names[0]; chapter=numKeys(d.books[book])[0]||"1"; } hl=null; viewMode="chapter"; render(); };

$("btn-back").onclick=()=>{ viewMode="chapter"; hl=null; render(); };
$("btn-tab").onclick=()=>{ if(lastQuery) openSearchTab(lastQuery); };
let tmr;
$("q").oninput=(e)=>{
  clearTimeout(tmr);
  tmr=setTimeout(()=>showResults(search(e.target.value), e.target.value), 160);
};
$("q").onfocus=()=>{ if($("q").value.trim().length>=2) showResults(search($("q").value), $("q").value); };
$("q").onkeydown=(e)=>{
  if(e.key==="Enter"){ e.preventDefault(); runSearch($("q").value, {openTab:true}); }
  if(e.key==="Escape") $("results").hidden=true;
};
$("results").onclick=(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  viewMode="chapter";
  book=b.dataset.b; chapter=b.dataset.c; hl=b.dataset.v; $("results").hidden=true; render();
  const el=$(`v-${hl}`); if(el) el.scrollIntoView({block:"center"});
};
content.onclick=(e)=>{
  const hit=e.target.closest(".hit"); if(!hit) return;
  viewMode="chapter";
  book=hit.dataset.b; chapter=hit.dataset.c; hl=hit.dataset.v;
  render();
  const el=$(`v-${hl}`); if(el) el.scrollIntoView({block:"center"});
};
document.addEventListener("click",(e)=>{ if(!e.target.closest(".search")) $("results").hidden=true; });
document.addEventListener("keydown",(e)=>{
  if(!(e.ctrlKey||e.metaKey) || e.key.toLowerCase()!=="a") return;
  const tag=(e.target.tagName||"");
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  e.preventDefault();
  const range=document.createRange(); range.selectNodeContents(content);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,(e)=>{
  e.preventDefault();
  if(e.dataTransfer && [...(e.dataTransfer.items||[])].some(it=>it.kind==="file")) $("drop").classList.add("show");
}));
document.addEventListener("dragleave",(e)=>{ if(e.target===$("drop")) $("drop").classList.remove("show"); });
document.addEventListener("drop",(e)=>{
  e.preventDefault(); $("drop").classList.remove("show");
  if(e.dataTransfer && e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
});

function pageDirUrl(){
  const u=new URL(location.href);
  u.hash="";
  u.search="";
  let path=u.pathname||"/";
  const last=path.split("/").pop()||"";
  if(last.includes(".")){
    path=path.slice(0, Math.max(0, path.lastIndexOf("/"))) + "/";
  } else if(!path.endsWith("/")){
    path += "/";
  }
  if(!path.startsWith("/")) path="/"+path;
  u.pathname=path;
  return u.href;
}
function resolveFromPage(rel){
  return new URL(rel, pageDirUrl()).href;
}
function discoverBases(){
  const bases=[pageDirUrl(), resolveFromPage("./bibles/")];
  const extra=new URLSearchParams(location.search).get("base");
  if(extra){
    try{
      const u=new URL(extra, pageDirUrl());
      if(!u.pathname.endsWith("/")) u.pathname += "/";
      bases.push(u.href);
    }catch{}
  }
  return [...new Set(bases)];
}
function filenameOf(url){
  try{ return decodeURIComponent(new URL(url, pageDirUrl()).pathname.split("/").pop()||""); }
  catch{ return String(url).split("/").pop()||""; }
}
function isIndexName(name){
  const base=(name||"").replace(/^.*[/\\]/,"").toLowerCase();
  return INDEX_BASENAMES.has(base);
}
function isJsonName(name){
  return /\.json$/i.test(name||"") && !/package-lock|tsconfig|manifest/i.test(name) && !isIndexName(name);
}
async function fetchTimeout(url, ms, cache){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(), ms);
  try{
    return await fetch(url, { cache: cache||"default", signal: ctrl.signal });
  } finally {
    clearTimeout(t);
  }
}
async function tryFetchDoc(url){
  try{
    const res=await fetchTimeout(url, FETCH_JSON_MS, "default");
    if(!res.ok) return null;
    const text=await res.text();
    const trimmed=(text||"").trim();
    if(!trimmed || trimmed[0]==="<") return null;
    let raw;
    try{ raw=JSON.parse(trimmed); }
    catch{ return null; }
    const name=filenameOf(url);
    if(isIndexName(name)) return null;
    return Object.assign(parseDoc(raw, name), { source:"fetch" });
  }catch{
    return null;
  }
}
function collectJsonHrefs(html, base){
  const urls=new Set();
  const re=/href\s*=\s*["']([^"']+\.json)["']/gi;
  let m;
  while((m=re.exec(html))){
    const href=m[1];
    if(!href || href.startsWith("?") || href.includes("..")) continue;
    try{
      const abs=new URL(href, base).href;
      if(isJsonName(filenameOf(abs))) urls.add(abs);
    }catch{}
  }
  return urls;
}
function pushManifestName(urls, n, base){
  if(typeof n==="string"){
    const name=n.trim();
    if(!name) return;
    if(/^https?:\/\//i.test(name)){
      if(isJsonName(filenameOf(name))) urls.add(name);
      return;
    }
    if(isJsonName(name)){
      try{ urls.add(new URL(name, base).href); }catch{}
    }
    return;
  }
  if(!n || typeof n!=="object") return;
  const name=n.file||n.path||n.name||n.url;
  pushManifestName(urls, name, base);
}
function extractManifestUrls(data, base){
  const urls=new Set();
  if(Array.isArray(data)){
    for(const n of data) pushManifestName(urls, n, base);
    return urls;
  }
  if(!data || typeof data!=="object") return urls;
  const arr=data.files||data.bibles||data.translations||data.json;
  if(Array.isArray(arr)){
    for(const n of arr) pushManifestName(urls, n, base);
  }
  for(const [k,v] of Object.entries(data)){
    if(k==="files"||k==="bibles"||k==="translations"||k==="json") continue;
    if(typeof v==="string" && isJsonName(v)) pushManifestName(urls, v, base);
    else if(v && typeof v==="object" && (v.file||v.path||v.name||v.url)) pushManifestName(urls, v, base);
  }
  return urls;
}
async function listDirJson(dirUrl){
  const urls=new Set();
  try{
    const res=await fetchTimeout(dirUrl, FETCH_INDEX_MS, "no-cache");
    if(!res.ok) return urls;
    const ct=res.headers.get("content-type")||"";
    const text=await res.text();
    const base=res.url || dirUrl;
    const looksJson=/json/i.test(ct) || /\.json$/i.test(dirUrl) || /^\s*[\[{]/.test(text);
    if(looksJson){
      try{
        const data=JSON.parse(text);
        for(const u of extractManifestUrls(data, base)) urls.add(u);
      }catch{}
    }
    if(/html/i.test(ct) || /^\s*</.test(text)){
      for(const u of collectJsonHrefs(text, base)) urls.add(u);
    }
  }catch{}
  return urls;
}
async function mapPool(items, limit, fn){
  const out=new Array(items.length);
  let i=0;
  async function worker(){
    while(i<items.length){
      const idx=i++;
      out[idx]=await fn(items[idx], idx);
    }
  }
  const n=Math.min(limit, items.length);
  await Promise.all(Array.from({length:n}, worker));
  return out;
}
async function discoverLocalJson(){
  if(!isHttp()) return [];
  if(new URLSearchParams(location.search).get("auto")==="0") return [];
  const bases=discoverBases();
  const urls=new Set();
  setLoad("같은 폴더에서 JSON 목록을 찾는 중…");
  const jobs=[];
  for(const dir of bases){
    jobs.push(listDirJson(dir));
    for(const idx of INDEX_FILES) jobs.push(listDirJson(new URL(idx, dir).href));
  }
  const listed=await Promise.all(jobs);
  for(const set of listed) for(const u of set) urls.add(u);
  for(const t of TRANSLATIONS){
    for(const file of t.files){
      for(const dir of bases) urls.add(new URL(file, dir).href);
    }
  }
  const unique=[...urls].filter(u=>isJsonName(filenameOf(u)));
  const found=[], seen=new Set();
  let done=0;
  setLoad(`번역 JSON ${unique.length}개를 확인하는 중…`);
  await mapPool(unique, 3, async (u)=>{
    const doc=await tryFetchDoc(u);
    done+=1;
    setLoad(`번역 JSON 확인 중… ${done}/${unique.length}`);
    if(!doc || seen.has(doc.id)) return;
    seen.add(doc.id);
    found.push(doc);
  });
  setLoad("");
  return found;
}

function restorePos(params){
  const pos=(()=>{try{return JSON.parse(localStorage.getItem("bible-reader:pos")||"null")}catch{return null}})();
  if(params.get("tr") && bibles[params.get("tr")]) translationId=params.get("tr");
  else if(pos && bibles[pos.translationId]) translationId=pos.translationId;
  const d=bibles[translationId]||current();
  if(!d) return;
  const names=sortBooks(Object.keys(d.books));
  if(params.get("book") && names.includes(params.get("book"))) book=params.get("book");
  else if(pos && names.includes(pos.book)) book=pos.book;
  else if(names.length) book=names[0];
  const chs=numKeys(d.books[book]||{});
  if(params.get("ch") && chs.includes(params.get("ch"))) chapter=params.get("ch");
  else if(pos && pos.book===book && chs.includes(pos.chapter)) chapter=pos.chapter;
  else if(chs.length) chapter=chs[0];
}

(async function init(){
  const params=new URLSearchParams(location.search);
  skipAutoTab = params.get("view")==="search";
  if(params.get("tr") && (bibles[params.get("tr")] || TRANSLATIONS.some(t=>t.id===params.get("tr")))){
    translationId=params.get("tr");
  }
  if(params.get("cmp")){
    compareOn=true;
    compareIds=params.get("cmp").split(",").map(s=>s.trim()).filter(Boolean);
  }
  if(params.get("q")) $("q").value=params.get("q");

  const stored=await loadAll();
  for(const d of stored){
    rememberMeta(d);
    bibles[d.id]=d;
  }
  $("status").textContent = stored.length ? `저장된 ${stored.length}개 번역본을 불러왔습니다.` : defaultStatus();
  restorePos(params);
  render();
  window.__BIBLE_VIEWER_READY = true;
  if(params.get("view")==="search" && (params.get("q")||"").trim().length>=2){
    runSearch(params.get("q"), {openTab:false});
  } else if(params.get("v")){
    hl=params.get("v");
    const el=$(`v-${hl}`); if(el) el.scrollIntoView({block:"center"});
  }

  try{ await restoreSavedFolder(); }catch{}

  let found=[];
  try{ found=await discoverLocalJson(); }catch(e){ setLoad(""); }
  if(found.length){
    await ingest(found, { selectFirst:false });
    if(params.get("view")==="search" && (params.get("q")||"").trim().length>=2){
      runSearch(params.get("q"), {openTab:false});
    }
  } else if(isHttp() && !loadedRealIds().length){
    $("status").textContent="미리보기 샘플입니다. HTML과 번역 JSON을 같은 폴더에 두면 자동으로 불러옵니다. GitHub Pages에서는 bibles.json을 함께 두세요.";
  }
})();
